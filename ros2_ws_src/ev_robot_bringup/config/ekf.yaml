# =============================================================================
#  ekf.yaml  (STEP 12)  --  robot_localization EKF
#  Fuses wheel odometry (/odom from the Pi) + D435i IMU (/camera/imu) and
#  publishes the odom->base_link transform. cuVSLAM then provides map->odom.
#
#  When you enable this, launch cuVSLAM with publish_odom_to_base:=false so the
#  EKF (not cuVSLAM) owns odom->base_link. The resulting tree:
#     map (cuVSLAM) -> odom (EKF) -> base_link -> camera_link
# =============================================================================
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true                 # ground robot
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom                # EKF outputs odom->base_link

    # ---- wheel odometry from the Pi (TETRIX PRIZM) ----
    odom0: /odom
    odom0_config: [false, false, false,    # x, y, z
                   false, false, false,    # roll, pitch, yaw
                   true,  true,  false,    # vx, vy, vz
                   false, false, true,     # vroll, vpitch, vyaw
                   false, false, false]    # ax, ay, az
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # ---- IMU from the D435i ----
    imu0: /camera/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,      # use yaw rate
                  true,  false, false]     # use x accel
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    process_noise_covariance: [0.05, 0.05, 0.06, 0.03, 0.03, 0.06,
                               0.025, 0.025, 0.04, 0.01, 0.01, 0.02,
                               0.01, 0.01, 0.015]
